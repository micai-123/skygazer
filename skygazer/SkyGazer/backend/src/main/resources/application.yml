spring:
  application:
    name: skygazer-weather-backend
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:mysql://localhost:3306/skygazer_weather?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.skygazer.weather.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain

jwt:
  secret: ${JWT_SECRET:skygazer-weather-secret-key-2026-must-be-at-least-256-bits}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

weather:
  api:
    provider: qweather
    key: ${QWEATHER_API_KEY:}
    base-url: ${QWEATHER_BASE_URL:https://mv33jqaeug.re.qweatherapi.com/v7}
    geo-url: ${QWEATHER_GEO_URL:https://mv33jqaeug.re.qweatherapi.com/geo/v2}

logging:
  level:
    root: INFO
    com.skygazer: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  weather:
    init-on-startup: false
