spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/skygazer_weather?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    root: WARN
    com.skygazer: INFO
  file:
    name: /var/log/weather/application.log
