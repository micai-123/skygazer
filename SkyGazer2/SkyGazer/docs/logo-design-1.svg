<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>SkyGazer Logo - 方案一：星月夜空</title>
  <desc>以Clear Night为主题的简约logo设计，展现晴朗夜空中明月高悬、繁星点点的景象</desc>
  
  <defs>
    <linearGradient id="blue-bg-main" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <linearGradient id="blue-stroke-main" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    
    <radialGradient id="moon-gradient-main" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFEB3B"/>
      <stop offset="60%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    
    <radialGradient id="moon-glow-main" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#blue-bg-main)" stroke="url(#blue-stroke-main)" stroke-width="4"/>
  
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#moon-glow-main)" stroke-width="20" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#moon-glow-main)" stroke-width="10" opacity="0.15"/>
  
  <circle cx="256" cy="256" r="120" fill="url(#moon-gradient-main)" filter="url(#glow)"/>
  
  <circle cx="100" cy="100" r="12" fill="#FFD54F" opacity="0.9"/>
  <circle cx="412" cy="100" r="10" fill="#FFD54F" opacity="0.8"/>
  <circle cx="380" cy="380" r="14" fill="#FFD54F" opacity="0.85"/>
  <circle cx="132" cy="380" r="8" fill="#FFD54F" opacity="0.7"/>
  <circle cx="160" cy="180" r="6" fill="#FFD54F" opacity="0.6"/>
  <circle cx="352" cy="160" r="7" fill="#FFD54F" opacity="0.65"/>
  <circle cx="180" cy="332" r="5" fill="#FFD54F" opacity="0.55"/>
  <circle cx="332" cy="352" r="9" fill="#FFD54F" opacity="0.75"/>
  
  <circle cx="220" cy="220" r="8" fill="#FFF9C4" opacity="0.3"/>
  <circle cx="280" cy="240" r="6" fill="#FFF9C4" opacity="0.25"/>
  <circle cx="240" cy="280" r="5" fill="#FFF9C4" opacity="0.2"/>
</svg>