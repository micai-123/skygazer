spring:
  datasource:
    url: jdbc:mysql://localhost:3306/skygazer_weather?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-key}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

logging:
  level:
    root: INFO
    com.skygazer: DEBUG
    org.springframework.ai: DEBUG
