spring:
  datasource:
    url: jdbc:h2:mem:skygazer_weather;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder-key-for-dev}
      base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      chat:
        options:
          model: ${AI_MODEL:qwen-plus}
          temperature: 0.7
          max-tokens: 2000
      image:
        options:
          model: ${AI_VISION_MODEL:qwen-vl-plus}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}

weather:
  api:
    provider: qweather
    key: ${QWEATHER_API_KEY:}
    base-url: ${QWEATHER_BASE_URL:https://mv33jqaeug.re.qweatherapi.com/v7}
    geo-url: ${QWEATHER_GEO_URL:https://mv33jqaeug.re.qweatherapi.com/geo/v2}
